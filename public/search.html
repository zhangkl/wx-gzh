<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搜索统计</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<div class="layout"><aside id="sidebar" class="sidebar"></aside><main class="main">
  <div class="topbar"><h2>搜索统计</h2></div>
  <div class="grid4" id="metrics"></div>
  <div class="grid2" style="margin-top:12px">
    <div class="card"><h3>搜索量趋势</h3><canvas id="searchTrend" width="700" height="240"></canvas></div>
    <div class="card"><h3>终端分布</h3><div id="terminal"></div></div>
  </div>
  <div class="panel" style="margin-top:12px">
    <div class="card"><h3>热门搜索词</h3><table class="table" id="hot"><thead><tr><th>排名</th><th>关键词</th><th>次数</th><th>占比</th><th>趋势</th></tr></thead><tbody></tbody></table></div>
    <div class="card"><h3>无结果搜索词</h3><table class="table" id="no"><thead><tr><th>排名</th><th>关键词</th><th>次数</th><th>用户数</th><th>操作</th></tr></thead><tbody></tbody></table></div>
  </div>
</main></div>
<script src="/app.js"></script>
<script>
mountSidebar('search');
async function init() {
  const m = await api('/api/metrics/search');
  metrics.innerHTML = `
    <div class='card metric'><div>总搜索次数</div><div class='v'>${m.searchCount}</div></div>
    <div class='card metric'><div>搜索用户数</div><div class='v'>${m.users}</div></div>
    <div class='card metric'><div>搜索成功率</div><div class='v'>${fmtPercent(m.successRate)}</div></div>
    <div class='card metric'><div>人均搜索次数</div><div class='v'>${m.perUserCount}</div></div>`;

  simpleLineChart(searchTrend, m.trends.map(t => t.date), m.trends.map(t => t.total), '#10b981');
  terminal.innerHTML = m.terminalDistribution.map(t => `<p>${t.name}: ${t.percent}%</p>`).join('');

  hot.querySelector('tbody').innerHTML = m.hotKeywords.map((i, idx) =>
    `<tr><td>${idx + 1}</td><td>${i.keyword}</td><td>${i.count}</td><td>${i.ratio}%</td><td>${i.trend}</td></tr>`).join('');

  no.querySelector('tbody').innerHTML = m.noResultKeywords.map((i, idx) =>
    `<tr><td>${idx + 1}</td><td>${i.keyword}</td><td>${i.count}</td><td>${i.users}</td><td><a href='/edit.html'>添加内容</a></td></tr>`).join('');
}
init();
</script>
</body>
</html>
