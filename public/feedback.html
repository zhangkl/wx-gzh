<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>评论反馈</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<div class="layout"><aside id="sidebar" class="sidebar"></aside><main class="main">
  <div class="topbar"><h2>评论反馈</h2></div>
  <div class="card">
    <div class="toolbar">
      <select id="articleSelect"></select>
      <select id="type"><option value="useful">有用</option><option value="useless">无用</option></select>
      <input id="comment" placeholder="反馈内容">
      <button class="btn primary" id="submit">添加反馈</button>
    </div>
  </div>
  <table class="table" id="table"><thead><tr><th>ID</th><th>文档</th><th>用户</th><th>类型</th><th>评论</th><th>日期</th></tr></thead><tbody></tbody></table>
</main></div>
<script src="/app.js"></script>
<script>
mountSidebar('feedback');
async function init() {
  const [articlesRes, list] = await Promise.all([api('/api/articles?page=1&pageSize=100'), api('/api/feedback')]);
  articleSelect.innerHTML = articlesRes.list.map(a => `<option value='${a.id}'>${a.title}</option>`).join('');
  table.querySelector('tbody').innerHTML = list.map(i => `<tr><td>${i.id}</td><td>${i.articleTitle}</td><td>${i.user}</td><td>${i.type}</td><td>${i.comment || '-'}</td><td>${i.createdAt}</td></tr>`).join('');
}

submit.onclick = async () => {
  await api('/api/feedback', {
    method: 'POST',
    body: JSON.stringify({ articleId: Number(articleSelect.value), type: type.value, comment: comment.value, user: 'admin' })
  });
  comment.value = '';
  await init();
};

init();
</script>
</body>
</html>
