<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据概览</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<div class="layout"><aside id="sidebar" class="sidebar"></aside><main class="main">
  <div class="topbar"><h2>数据概览</h2></div>
  <div class="grid4" id="metrics"></div>
  <div class="grid2" style="margin-top:12px">
    <div class="card"><h3>浏览量趋势</h3><canvas id="trend" width="700" height="240"></canvas></div>
    <div class="card"><h3>分类占比（按浏览）</h3><div id="distribution"></div></div>
  </div>
  <div class="card" style="margin-top:12px"><h3>热门内容排行</h3><table class="table" id="rank"><thead><tr><th>排名</th><th>标题</th><th>分类</th><th>浏览量</th><th>有用率</th><th>更新时间</th></tr></thead><tbody></tbody></table></div>
</main></div>
<script src="/app.js"></script>
<script>
mountSidebar('overview');
async function init() {
  const [m, articlesRes] = await Promise.all([api('/api/metrics/overview'), api('/api/articles?page=1&pageSize=20')]);
  metrics.innerHTML = `
    <div class='card metric'><div>总内容数</div><div class='v'>${m.contentCount}</div></div>
    <div class='card metric'><div>总浏览量</div><div class='v'>${m.viewCount}</div></div>
    <div class='card metric'><div>平均阅读时长</div><div class='v'>${m.avgReadDuration}</div></div>
    <div class='card metric'><div>有用反馈率</div><div class='v'>${fmtPercent(m.usefulRate)}</div></div>`;

  simpleLineChart(trend, m.trends.map(t => t.date), m.trends.map(t => t.total), '#3b82f6');

  const totalViews = m.categoryDistribution.reduce((s, i) => s + i.views, 0) || 1;
  distribution.innerHTML = m.categoryDistribution.map(item => {
    const p = ((item.views / totalViews) * 100).toFixed(1);
    return `<p>${item.name}：${item.views}（${p}%）</p>`;
  }).join('');

  rank.querySelector('tbody').innerHTML = articlesRes.list
    .sort((a, b) => b.views - a.views)
    .map((a, idx) => `<tr><td>${idx + 1}</td><td>${a.title}</td><td>${a.categoryName}</td><td>${a.views}</td><td>${fmtPercent(a.usefulRate)}</td><td>${a.updatedAt}</td></tr>`)
    .join('');
}
init();
</script>
</body>
</html>
